<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Agents</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>ChatGPT Agent</h1>
        <p id="summary">Loading...</p>
      </div>
      <label class="button primary compact" for="file-input">Import JSON</label>
      <input id="file-input" type="file" accept="application/json,.json" hidden />
    </header>

    <section class="toolbar" aria-label="Agent controls">
      <label>
        <span>Mode</span>
        <select id="default-mode">
          <option value="auto">Autonomous</option>
        </select>
      </label>
      <label>
        <span>Agents</span>
        <input id="max-concurrent" type="number" min="1" max="1" step="1" value="1" disabled />
      </label>
      <label>
        <span>Browser steps</span>
        <input id="max-continuations" type="number" min="5" max="100" step="1" value="40" />
      </label>
    </section>

    <div class="global-actions">
      <button id="pause-all" class="button secondary">Pause</button>
      <button id="resume-all" class="button secondary">Resume</button>
      <label class="mouse-toggle" title="Show the agent pointer inside the audited browser tab">
        <input id="visual-mouse" type="checkbox" checked />
        <span class="mouse-toggle-track" aria-hidden="true"><i></i></span>
        <span>Visual mouse</span>
      </label>
    </div>

    <div class="task-json-settings" aria-label="Task JSON automation">
      <label title="Detect task JSON in completed ChatGPT assistant responses">
        <input id="auto-detect-task-json" type="checkbox" checked />
        <span>Detect JSON</span>
      </label>
      <label title="Import newly detected tasks automatically without replacing existing task IDs">
        <input id="auto-import-task-json" type="checkbox" checked />
        <span>Auto import</span>
      </label>
      <label title="Start the first newly imported task automatically">
        <input id="auto-start-task-json" type="checkbox" />
        <span>Auto start</span>
      </label>
    </div>

    <div id="detected-task-notice" class="notice detected-task-notice" role="status" hidden></div>
    <div id="notice" class="notice" role="status" hidden></div>
    <main id="task-list" class="task-list"></main>

    <template id="empty-template">
      <section class="empty-state">
        <strong>No tasks loaded</strong>
        <p>Generate task JSON in ChatGPT or import a JSON file, then let one agent work through it end-to-end.</p>
      </section>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
